name: Raycast Extension CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Build & Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Raycast SDK lint (manifest, icons, metadata, ESLint & Prettier)
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run contract & unit test suite
        run: npm test

      - name: Verify Raycast distribution build (ray build -e dist)
        run: npm run build
